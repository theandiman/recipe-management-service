name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Build and Test
    uses: theandiman/recipe-management/.github/workflows/backend-java-ci.yml@fb4a93a388f8d5b1bf8ed5bebfbdfecc0cb5c3fb
    permissions:
      contents: read
      actions: write
      packages: read
    with:
      run_sonar: true
      sonar_project_key: theandiman_recipe-management-storage-service
    secrets: inherit

  cd:
    name: Deploy
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: theandiman/recipe-management/.github/workflows/backend-java-cloud-run-cd.yml@fb4a93a388f8d5b1bf8ed5bebfbdfecc0cb5c3fb
    permissions:
      contents: write
      actions: write
      id-token: write
    with:
      service_name: recipe-management-service
      artifact_registry_repository: recipe-management
      use_wif: true
      zap_rules: "10049\tIGNORE\t(Non-Storable Content - expected for auth-protected endpoints returning 401)"
    secrets: inherit
