# Application
spring.application.name=recipe-management-service
server.port=${PORT:8081}

# Firebase Configuration
firebase.project.id=recipe-mgmt-dev

# Authentication
auth.enabled=true

# Firestore Configuration
# Credentials are loaded from GOOGLE_APPLICATION_CREDENTIALS environment variable
# Collection name for recipes
firestore.collection.recipes=recipes
# Collection name for users
firestore.collection.users=users
# Collection name for follows
firestore.collection.follows=follows
# Top-level collection for saved-recipe subcollections (savedRecipes/{uid}/recipes/{recipeId})
firestore.collection.saved-recipes=savedRecipes
# Top-level collection for likes subcollections (likes/{recipeId}/users/{uid})
firestore.collection.likes=likes

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.metrics.export.defaults.enabled=true

# OpenTelemetry Configuration for Honeycomb
# These properties will be used by the OpenTelemetry Java agent
otel.service.name=recipe-management-service
otel.service.version=${SERVICE_VERSION:0.0.1-SNAPSHOT}
otel.traces.exporter=otlp
otel.metrics.exporter=otlp
otel.logs.exporter=otlp
otel.exporter.otlp.endpoint=https://api.honeycomb.io:443
otel.exporter.otlp.headers=api-key=${HONEYCOMB_API_KEY}
otel.exporter.otlp.protocol=grpc
otel.resource.attributes=service.instance.id=${HOSTNAME}

# Enable automatic MDC population with trace context
# This will populate trace_id and span_id in SLF4J MDC for correlation in logs
otel.instrumentation.logback-mdc.add-baggage=true

# Logging
logging.level.com.recipe.storage=INFO
logging.level.com.google.cloud.firestore=DEBUG
logging.level.io.opentelemetry=DEBUG
